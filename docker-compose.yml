services:
  postgres:
    image: postgres:16-alpine
    container_name: photoforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: photoforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - photoforge_data:/var/lib/postgresql/data

volumes:
  photoforge_data:
